<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Abisha G, Python full stack developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <clipPath id="clip"><rect width="1000" height="430" rx="24"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#ff9a4d"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".30"/><stop offset="1" stop-color="#ffffff" stop-opacity=".08"/></linearGradient>
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}
    .mono{font-family:'Fira Code',Consolas,Menlo,monospace;font-size:14px;white-space:pre}
    .in{opacity:0;animation:in 1s ease forwards}
    .up{opacity:0;transform:translateY(22px);animation:up 1s cubic-bezier(.22,1,.36,1) forwards}
    .ln{opacity:0;animation:ln .6s ease forwards}
    .bob{animation:bob 4.5s ease-in-out infinite alternate}
    .cur{animation:blink 1s steps(2,start) infinite}
    @keyframes in{to{opacity:1}}
    @keyframes up{to{opacity:1;transform:none}}
    @keyframes ln{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
    @keyframes bob{to{transform:translateY(-10px)}}
    @keyframes blink{to{opacity:0}}
  </style>
</defs>

<g clip-path="url(#clip)">
  <rect width="1000" height="430" fill="#0d0a26"/>
  <g filter="url(#blur)">
    <circle cx="120" cy="60" r="170" fill="#7c6cf5" opacity=".5"><animateTransform attributeName="transform" type="translate" values="0 0;50 40;0 0" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="250" r="150" fill="#f97316" opacity=".33"><animateTransform attributeName="transform" type="translate" values="0 0;-50 -30;0 0" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="450" r="140" fill="#22d3ee" opacity=".25"><animateTransform attributeName="transform" type="translate" values="0 0;40 -30;0 0" dur="18s" repeatCount="indefinite"/></circle>
  </g>
</g>

<!-- status pill -->
<g class="in" style="animation-delay:.1s">
  <rect x="60" y="80" width="330" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="url(#edge)"/>
  <circle cx="82" cy="99" r="5" fill="#34d399"/>
  <circle cx="82" cy="99" r="5" fill="none" stroke="#34d399"><animate attributeName="r" values="5;13" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2s" repeatCount="indefinite"/></circle>
  <text x="100" y="104" font-size="14" font-weight="600" fill="#f1efff">Open to full stack developer roles</text>
</g>

<!-- title -->
<text class="serif up" x="56" y="205" font-size="96" fill="#f1efff" style="animation-delay:.3s">Abisha G</text>
<text class="up" x="60" y="256" font-size="18" fill="#b4b0e0" style="animation-delay:.6s">Python full stack developer who builds</text>
<text class="up" x="60" y="282" font-size="18" fill="#b4b0e0" style="animation-delay:.7s">web apps you can open and use.</text>

<!-- buttons -->
<g class="up" style="animation-delay:.9s">
  <rect x="60" y="316" width="156" height="46" rx="23" fill="url(#btn)"/>
  <text x="138" y="345" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">See my work</text>
  <rect x="230" y="316" width="130" height="46" rx="23" fill="#ffffff" fill-opacity=".07" stroke="url(#edge)"/>
  <text x="295" y="345" font-size="15" font-weight="800" fill="#f1efff" text-anchor="middle">Email me</text>
</g>

<!-- code window -->
<g class="in" style="animation-delay:.4s">
  <rect x="560" y="96" width="380" height="250" rx="20" fill="#ffffff" fill-opacity=".07" stroke="url(#edge)"/>
  <line x1="560" y1="132" x2="940" y2="132" stroke="#ffffff" stroke-opacity=".15"/>
  <circle cx="582" cy="114" r="5.5" fill="#ff5f57"/><circle cx="601" cy="114" r="5.5" fill="#febc2e"/><circle cx="620" cy="114" r="5.5" fill="#28c840"/>
</g>
<text class="mono ln" x="584" y="170" fill="#b4b0e0" style="animation-delay:.8s"># abisha.py</text>
<text class="mono ln" x="584" y="198" style="animation-delay:1.1s"><tspan fill="#c792ea">class</tspan> <tspan fill="#82aaff">Developer</tspan><tspan fill="#f1efff">:</tspan></text>
<text class="mono ln" x="584" y="226" style="animation-delay:1.4s" fill="#f1efff">  stack = [<tspan fill="#c3e88d">"Django"</tspan>, <tspan fill="#c3e88d">"React"</tspan>,</text>
<text class="mono ln" x="584" y="254" style="animation-delay:1.7s" fill="#f1efff">           <tspan fill="#c3e88d">"MySQL"</tspan>]</text>
<text class="mono ln" x="584" y="282" style="animation-delay:2s" fill="#f1efff">  <tspan fill="#c792ea">def</tspan> <tspan fill="#82aaff">ship</tspan>(self):</text>
<text class="mono ln" x="584" y="310" style="animation-delay:2.3s" fill="#f1efff">    <tspan fill="#c792ea">return</tspan> <tspan fill="#c3e88d">"live apps"</tspan></text>
<rect class="cur" x="780" y="297" width="8" height="16" fill="#f97316"/>

<!-- floating chips -->
<g class="bob"><g class="in" style="animation-delay:1s"><rect x="840" y="64" width="92" height="34" rx="17" fill="#ffffff" fill-opacity=".1" stroke="url(#edge)"/><text x="886" y="86" font-size="14" font-weight="800" fill="#f1efff" text-anchor="middle">Django</text></g></g>
<g class="bob" style="animation-delay:-2s"><g class="in" style="animation-delay:1.2s"><rect x="505" y="290" width="84" height="34" rx="17" fill="#ffffff" fill-opacity=".1" stroke="url(#edge)"/><text x="547" y="312" font-size="14" font-weight="800" fill="#f1efff" text-anchor="middle">React</text></g></g>
<g class="bob" style="animation-delay:-3.5s"><g class="in" style="animation-delay:1.4s"><rect x="810" y="330" width="88" height="34" rx="17" fill="#ffffff" fill-opacity=".1" stroke="url(#edge)"/><text x="854" y="352" font-size="14" font-weight="800" fill="#f1efff" text-anchor="middle">MySQL</text></g></g>
</svg>
